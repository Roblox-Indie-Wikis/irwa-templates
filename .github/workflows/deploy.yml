name: Deploy Templates

on:
  workflow_dispatch:
    inputs:
      editSummary:
        description: 'Edit summary'
        default: 'Update templates'
        required: true
        type: string
      dryRun:
        description: 'Perform a dry run'
        default: false
        required: true
        type: boolean

jobs:
  deploy-templates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Run bot
        run: npx tsx bot.ts
        env:
          COMMIT_MESSAGE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.editSummary || github.event.head_commit.message }}
          COMMIT_AUTHOR_NAME: ${{ github.event.head_commit.author.name }}
          MIRAHEZE_ACCESS_TOKEN: ${{ secrets.MIRAHEZE_ACCESS_TOKEN }}
          DOVEDALE_ACCESS_TOKEN: ${{ secrets.DOVEDALE_ACCESS_TOKEN }}
          BOT_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dryRun == 'true' }}
